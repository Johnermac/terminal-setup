set -g escape-time 10
set -g history-limit 50000
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g mouse on
set -g set-clipboard on
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -r S-Left  resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up    resize-pane -U 5
bind -r S-Down  resize-pane -D 5

bind S setw synchronize-panes on
bind s setw synchronize-panes off

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
bind C-j display-popup -E -w 85% -h 75% "~/.local/bin/tmux-sessions"
bind G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind D display-popup -E -w 90% -h 90% lazydocker

bind j run-shell -b "~/.local/bin/claude-tmux jump"
bind J display-popup -E -w 60% -h 40% "~/.local/bin/claude-tmux pick"
set-hook -g client-session-changed "run-shell -b \"~/.local/bin/claude-tmux seen #{pane_id}\""
set-hook -g session-window-changed "run-shell -b \"~/.local/bin/claude-tmux seen #{pane_id}\""
set-hook -g after-select-pane "run-shell -b \"~/.local/bin/claude-tmux seen #{pane_id}\""

bind / copy-mode \; command-prompt -i -p "search:" "send -X search-backward-incremental '%%'"

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W#{?#{m:*wait*,#{P:#{@claude} }}, ?,#{?#{m:*done*,#{P:#{@claude} }}, ✓,#{?#{m:*busy*,#{P:#{@claude} }}, ●,}}}"
set -g @catppuccin_window_current_text " #W#{?#{m:*wait*,#{P:#{@claude} }}, ?,#{?#{m:*done*,#{P:#{@claude} }}, ✓,#{?#{m:*busy*,#{P:#{@claude} }}, ●,}}}"
set -g @catppuccin_date_time_text " %H:%M"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#[fg=red,bold]#{?pane_synchronized,SYNC ON ,}#[default]"
set -ag status-right "#[fg=#f9e2af,bold]#{?#{!=:#{@claude_count},0},#{?@claude_count,✻ #{@claude_count} ,},}#[default]"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'

set -g window-style "bg=#181825"
set -g window-active-style "bg=#1e1e2e"
set -g pane-border-lines heavy
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g pane-border-status top
set -g pane-border-format " #{?#{==:#{@claude},busy},#[fg=#fab387]● ,#{?#{==:#{@claude},wait},#[fg=#f9e2af]? ,#{?#{==:#{@claude},done},#[fg=#a6e3a1]✓ ,}}}#{?pane_active,#[fg=#cba6f7]#[bold],#[fg=#6c7086]}#{b:pane_current_path}#[nobold]#{?pane_active,#[fg=#fab387],#[fg=#6c7086]}#(~/.local/bin/tmux-git-title #{pane_current_path}) "

if -F '#{!=:#{pane-border-boxes},}' {
  set -g pane-border-lines rounded
  set -g popup-border-lines rounded
  set -g extended-keys on
  set -g extended-keys-format csi-u
  set -as terminal-features ',xterm*:extkeys,*:hyperlinks,*:sync'
  set -g pane-border-boxes off
  set -g @boxes 1
  set -g @boxes_want '#{?#{&&:#{@boxes},#{&&:#{!=:#{window_panes},1},#{!=:#{window_zoomed_flag},1}}},on,off}'
  set-hook -g window-layout-changed { setw -F pane-border-boxes '#{E:@boxes_want}' }
  set-hook -g after-resize-pane { setw -F pane-border-boxes '#{E:@boxes_want}' }
  bind -n MouseDown1Border { select-pane -t = ; select-pane -M }
  bind B { if -F '#{@boxes}' { set -g @boxes 0 } { set -g @boxes 1 } ; setw -F pane-border-boxes '#{E:@boxes_want}' }
  bind N { if -F '#{m:rounded,#{pane-border-lines}}' { set -g pane-border-lines heavy } { set -g pane-border-lines rounded } }
}
