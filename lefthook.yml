pre-commit:
  parallel: true
  commands:
    shellcheck:
      glob: "*.sh"
      run: shellcheck -x {staged_files}
    shfmt:
      glob: "*.sh"
      run: shfmt -d -i 2 -ci {staged_files}
    trailing-whitespace:
      run: |
        if grep -InE ' +$' {staged_files}; then
          echo "trailing whitespace above" >&2
          exit 1
        fi

commit-msg:
  commands:
    conventional-commit:
      run: |
        head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+' || {
          echo "commit message must follow conventional commits: type(scope): subject" >&2
          exit 1
        }
